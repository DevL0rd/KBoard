name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Find out whether code changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Treat documentation-only changes as no code change
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          code=true
          if [[ -n $BASE && $BASE != 0000000000000000000000000000000000000000 ]] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            if ! git diff --name-only "$BASE" "$GITHUB_SHA" | grep -qvE '^(docs/|LICENSE$)|\.md$'; then
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Check the file lengths, shell, formatting, spelling and duplicate code
        run: docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src archlinux:base-devel tests/ci/run.sh lint

  unit:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Build, unit tests and qmllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/container
        with:
          mode: unit
          cache: unit
          save-cache: "true"

  install-script:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Install and uninstall scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/container
        with:
          mode: install
          cache: install
          save-cache: "true"

  tidy:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: clang-tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/container
        with:
          mode: tidy
          cache: clang
          save-cache: "true"

  xunused:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Unused functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/container
        with:
          mode: xunused
          cache: clang

  distros:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Install dependencies${{ matrix.build && ' and build' || '' }} on ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Fedora 44
            cache: fedora
            ccache: dnf install -y ccache
            image: fedora:44
            plasma: dnf install -y git plasma-desktop
            bundled-whisper: 'ON'
            build: true
          - name: openSUSE Tumbleweed
            cache: tumbleweed
            ccache: zypper --non-interactive install ccache
            image: opensuse/tumbleweed
            plasma: zypper --non-interactive dup --allow-downgrade && zypper --non-interactive install --force-resolution git plasma6-desktop
            bundled-whisper: 'ON'
            build: true
          - name: Debian testing
            image: debian:testing
            plasma: apt-get update && apt-get install -y git plasma-desktop
            build: false
          - name: Debian unstable
            cache: debian-unstable
            ccache: apt-get install -y ccache
            image: debian:unstable
            plasma: apt-get update && apt-get install -y git plasma-desktop
            bundled-whisper: 'OFF'
            build: true
          - name: SteamOS 3.9
            cache: steamos
            ccache: pacman -S --noconfirm --needed ccache
            image: archlinux:latest
            plasma: |
              repos="jupiter-3.9 holo-3.9 core-3.9 extra-3.9 multilib-3.9"
              conf() {
                printf '[options]\nArchitecture = auto\nSigLevel = %s\nLocalFileSigLevel = Optional\n' "$1"
                for repo in $repos; do printf '[%s]\nServer = https://steamdeck-packages.steamos.cloud/archlinux-mirror/$repo/os/$arch\n' "$repo"; done
              }
              conf Never > /etc/pacman-bootstrap.conf
              pacman -Sy --noconfirm --config /etc/pacman-bootstrap.conf holo-keyring
              pacman-key --init
              pacman-key --populate archlinux holo
              conf "Required DatabaseOptional" > /etc/pacman.conf
              pacman -Syuu --noconfirm --ignore filesystem
              pacman -S --noconfirm --needed git plasma-desktop
            bundled-whisper: 'ON'
            build: true
    container:
      image: ${{ matrix.image }}
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install Plasma
        run: ${{ matrix.plasma }}

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install KBoard's dependencies
        run: packaging/dependencies.sh

      - name: Install the compiler cache
        if: matrix.build
        run: ${{ matrix.ccache }}

      - name: Restore the compiler cache
        if: matrix.build
        id: compiler-cache
        uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: ccache-${{ matrix.cache }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.cache }}-

      - name: Check the build dependencies
        if: matrix.build
        run: packaging/check-build-dependencies "$(sed -n 's/^set(QT_MIN_VERSION "\(.*\)")$/\1/p' CMakeLists.txt)"

      - name: Build and install
        if: matrix.build
        env:
          CCACHE_MAXSIZE: 2G
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          export CCACHE_DIR="$PWD/.ccache"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DKDE_INSTALL_USE_QT_SYS_PATHS=ON -DBUILD_TESTING=OFF -DKBOARD_WERROR=OFF
          grep -qx 'KBOARD_BUNDLED_WHISPER:BOOL=${{ matrix.bundled-whisper }}' build/CMakeCache.txt
          cmake --build build
          DESTDIR="$PWD/staging" cmake --install build
          find staging -path '*/bin/kboard' | grep .
          find staging -path '*/applications/org.devl0rd.kboard.desktop' | grep .
          if [ '${{ matrix.bundled-whisper }}' = ON ] && find staging \( -name '*whisper*' -o -name '*ggml*' -o -name '*parakeet*' \) | grep .; then
            exit 1
          fi

      - name: Save the compiler cache
        if: ${{ !cancelled() && matrix.build && steps.compiler-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: .ccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

  install:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Install, check and uninstall on Arch Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Restore the compiler cache
        id: compiler-cache
        uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: ccache-plasma-${{ github.sha }}
          restore-keys: ccache-plasma-

      - name: Give KWin a vgem render node, so it composites with OpenGL on Mesa's llvmpipe
        run: tests/install/vgem.sh

      - name: Install, check and uninstall KBoard in a Plasma session
        env:
          KBOARD_TEST_CCACHE: .ccache
        run: tests/install/run.sh

      - name: Save the compiler cache
        if: ${{ !cancelled() && steps.compiler-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: .ccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

  release:
    name: Release
    needs: [lint, unit, install-script, tidy, xunused, distros, install]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Create the source archive
        run: |
          version="${GITHUB_REF_NAME#v}"
          git archive --format=tar --prefix="kboard-${version}/" -o "kboard-${version}.tar" HEAD
          git submodule foreach --quiet "git archive --format=tar --prefix=\"kboard-${version}/\$sm_path/\" HEAD > \"\$toplevel/submodule.tar\"; tar --concatenate --file=\"\$toplevel/kboard-${version}.tar\" \"\$toplevel/submodule.tar\"; rm \"\$toplevel/submodule.tar\""
          gzip -9 "kboard-${version}.tar"
          sha256sum "kboard-${version}.tar.gz" > "kboard-${version}.tar.gz.sha256"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            kboard-*.tar.gz
            kboard-*.tar.gz.sha256
          body: |
            ## Install

            KBoard is built against the Qt version on your machine, so install it from source:

            ```sh
            git clone --recursive --branch ${{ github.ref_name }} https://github.com/${{ github.repository }}.git
            cd KBoard
            ./install.sh
            ```

            The installer installs the build dependencies and makes KBoard your on-screen keyboard right away. It updates itself with every system update and rebuilds after Qt upgrades.

            Updating from an older version is the same command: `./install.sh`. To remove it, run `./uninstall.sh`; your previous keyboard comes back.

            The attached archive is the same source tree, including the Plasma-Shared submodule, for offline installs.
