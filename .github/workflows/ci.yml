name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Build, test and lint
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install the check tools
        run: pacman -Syu --noconfirm --needed git cmake ninja clang llvm openmp dbus typos nodejs npm shellcheck

      - name: Build xunused
        run: |
          git clone https://github.com/mgehre/xunused.git /tmp/xunused
          git -C /tmp/xunused checkout b81e0ef
          if [[ ! -f /usr/include/clang/Driver/Options.h ]]; then
            sed -i 's|#include "clang/Driver/Options.h"|#include "clang/Options/Options.h"|' /tmp/xunused/main.cpp
          fi
          cmake -S /tmp/xunused -B /tmp/xunused/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/xunused/build
          install -Dm755 /tmp/xunused/build/xunused /usr/local/bin/xunused

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Mark checkout as safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install KBoard's dependencies
        run: packaging/dependencies.sh

      - name: Run the full check suite
        run: ./tools/check.sh

  distros:
    name: Install dependencies${{ matrix.build && ' and build' || '' }} on ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Fedora 44
            image: fedora:44
            plasma: dnf install -y git plasma-desktop
            build: false
          - name: openSUSE Tumbleweed
            image: opensuse/tumbleweed
            plasma: zypper --non-interactive dup --allow-downgrade && zypper --non-interactive install --force-resolution git plasma6-desktop
            build: false
          - name: Debian testing
            image: debian:testing
            plasma: apt-get update && apt-get install -y git plasma-desktop
            build: false
          - name: Debian unstable
            image: debian:unstable
            plasma: apt-get update && apt-get install -y git plasma-desktop
            build: true
    container:
      image: ${{ matrix.image }}
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install Plasma
        run: ${{ matrix.plasma }}

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install KBoard's dependencies
        run: packaging/dependencies.sh

      - name: Build and install
        if: matrix.build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DKDE_INSTALL_USE_QT_SYS_PATHS=ON -DBUILD_TESTING=OFF -DKBOARD_WERROR=OFF
          cmake --build build
          DESTDIR="$PWD/staging" cmake --install build
          find staging -path '*/bin/kboard' | grep .
          find staging -path '*/applications/org.devl0rd.kboard.desktop' | grep .

  install:
    name: Install, check and uninstall on Arch Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install, check and uninstall KBoard in a Plasma session
        run: tests/install/run.sh

  release:
    name: Release
    needs: checks
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Create the source archive
        run: |
          version="${GITHUB_REF_NAME#v}"
          git archive --format=tar --prefix="kboard-${version}/" -o "kboard-${version}.tar" HEAD
          git submodule foreach --quiet 'git archive --format=tar --prefix="kboard-'"${version}"'/$sm_path/" HEAD > "$toplevel/submodule.tar"; tar --concatenate --file="$toplevel/kboard-'"${version}"'.tar" "$toplevel/submodule.tar"; rm "$toplevel/submodule.tar"'
          gzip -9 "kboard-${version}.tar"
          sha256sum "kboard-${version}.tar.gz" > "kboard-${version}.tar.gz.sha256"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            kboard-*.tar.gz
            kboard-*.tar.gz.sha256
          body: |
            ## Install

            KBoard is built against the Qt version on your machine, so install it from source:

            ```sh
            git clone --recursive --branch ${{ github.ref_name }} https://github.com/${{ github.repository }}.git
            cd KBoard
            ./install.sh
            ```

            The installer installs the build dependencies and makes KBoard your on-screen keyboard right away. It updates itself with every system update and rebuilds after Qt upgrades.

            Updating from an older version is the same command: `./install.sh`. To remove it, run `./uninstall.sh`; your previous keyboard comes back.

            The attached archive is the same source tree, including the Plasma-Shared submodule, for offline installs.
